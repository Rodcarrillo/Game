<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Michelson's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap">
<style>
/* MICHELSON'S ARCADE — Isla Pemol
   Juego de fiesta: calcomanías con contorno azul marino grueso, sombras sólidas,
   azul rey y naranja. Un solo look deliberado (no cambia con el tema del sistema). */
:root {
  --ink: #1b2440;
  --paper: #ffffff;
  --cream: #fff7e6;
  --sea: #7fd0ff;
  --lilac: #c7a8ff;
  --gold: #ffc531;
  --berry: #ff5a1f;
  --royal: #1f3fbf;
  --royal-deep: #0c1f6b;
  --blue: #3d8bff;
  --mint: #2ecc8f;
  --red: #ff4d5e;
  --muted: #5b6684;
  --display: 'Titan One', 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --r: 22px;
  --line: 4px;
  --drop: 0 6px 0 var(--ink);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--body);
  font-size: 18px;
  color: var(--ink);
  background: var(--sea);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, .display { font-family: var(--display); font-weight: 400; letter-spacing: .01em; margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); margin: 6px 0 0; }
.ico { display: inline-block; vertical-align: middle; flex: none; }

/* ---------- botones ---------- */
.btn {
  appearance: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 22px;
  font-family: var(--display); font-size: 22px; letter-spacing: .02em;
  color: var(--ink); background: var(--gold);
  border: var(--line) solid var(--ink); border-radius: 18px;
  box-shadow: var(--drop);
  cursor: pointer; text-decoration: none;
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
.btn:disabled { filter: grayscale(.7) opacity(.55); cursor: not-allowed; transform: none; box-shadow: var(--drop); }
.btn.alt { background: var(--berry); color: #fff; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.mint { background: var(--mint); }
.btn.ghost { background: var(--paper); }
.btn.small { font-size: 17px; padding: 8px 14px; border-radius: 14px; }
.btn small { display: block; font-family: var(--body); font-size: 14px; font-weight: 700; opacity: .85; }
.icon-btn { padding: 8px 12px; font-size: 17px; }

.panel, .card {
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: var(--r);
  box-shadow: var(--drop);
}

.tag { display: inline-block; font: 700 11px/1 var(--body); letter-spacing: .08em; padding: 4px 6px; border-radius: 8px; background: #ece6ff; color: var(--ink); margin-left: 6px; vertical-align: 2px; }
.tag-shield { background: #bfeaff; }
.tag-off { background: #ffd0d5; }

/* ================= TV ================= */
body.tv { overflow: hidden; }
.stage { position: fixed; inset: 0; overflow: hidden; }
.board-host { position: absolute; inset: 0; }
.board-svg { width: 100%; height: 100%; display: block; }
.board-label { font-family: var(--display); font-size: 19px; fill: #fff; letter-spacing: .04em; }
.board-label.small { font-size: 15px; fill: var(--ink); }
.board-mini { font-family: var(--display); font-size: 12px; fill: #fff; letter-spacing: .06em; }
.board-mini.gold { fill: #ffb400; }
.board-sign { font-family: var(--display); font-size: 17px; fill: #fff; letter-spacing: .05em; }
.board-neon { font-family: var(--display); font-size: 22px; fill: #ff8ae6; letter-spacing: .08em; filter: drop-shadow(0 0 4px #ff4fd8); animation: neon 2.4s steps(1) infinite; }
@keyframes neon { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: .35; } 50% { opacity: 1; } 52% { opacity: .5; } 53% { opacity: 1; } }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .2; } }
.wave { animation: wave 5s ease-in-out infinite; }
@keyframes wave { 50% { transform: translateX(14px); opacity: .1; } }
.beam { transform-origin: 12px -48px; animation: beam 6s ease-in-out infinite; }
@keyframes beam { 50% { transform: rotate(-30deg); } }
.spot { transform-origin: 0 -30px; animation: spot 3.5s ease-in-out infinite alternate; }
@keyframes spot { to { transform: rotate(14deg); } }
.sun { mix-blend-mode: screen; }
.token-ring { opacity: .9; }
.stall { transform-box: fill-box; }
.board-badge { font-family: var(--display); font-size: 26px; fill: #fff; }
.board-steps { font-family: var(--display); font-size: 32px; fill: var(--ink); }
.float-text { font-family: var(--display); font-size: 40px; stroke: var(--ink); stroke-width: 6px; paint-order: stroke; }
.float-up { animation: floatUp 1.6s ease-out forwards; }
@keyframes floatUp { 0% { transform: translateY(14px) scale(.6); opacity: 0; } 15% { transform: translateY(0) scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }

.tile .tile-halo { fill: transparent; }
.tile.is-here .tile-halo { fill: #fff; opacity: .7; animation: halo 1.2s ease-in-out infinite; }
.tile.is-option .tile-halo { fill: var(--gold); opacity: .9; animation: halo .8s ease-in-out infinite; }
@keyframes halo { 50% { opacity: .25; } }
.token .token-marker { opacity: 0; transform: translateY(-112px); }
.token.is-current .token-marker { opacity: 1; animation: marker 1s ease-in-out infinite; }
@keyframes marker { 50% { transform: translateY(-122px); } }
.token-bob { animation: bob 2.4s ease-in-out infinite; }
.token.is-current .token-bob { animation-duration: 1.2s; }
@keyframes bob { 50% { transform: translateY(-3px) scaleY(1.03); } }

/* barra superior */
.topbar {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; z-index: 40; max-width: calc(100% - 340px);
}
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; background: var(--paper);
  border: var(--line) solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink);
  font-family: var(--display); font-size: 20px;
}
.chip.logo { background: var(--berry); color: #fff; }
.chip.round b { font-size: 24px; }
.chip.code { letter-spacing: .14em; }
.chip.code small { font-family: var(--body); font-weight: 700; letter-spacing: 0; font-size: 13px; color: var(--muted); }

/* HUD de jugadores */
.hud {
  position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); bottom: 14px;
  width: 300px; display: flex; flex-direction: column; gap: 10px; z-index: 6; overflow-y: auto; padding: 2px 4px 10px;
}
.pcard {
  position: relative; display: grid; grid-template-columns: 30px 56px 1fr; align-items: center; gap: 8px;
  padding: 8px 12px 8px 8px; background: var(--paper);
  border: var(--line) solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink);
  transition: transform .25s;
}
.pcard::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 10px; border-radius: 16px 0 0 16px; background: var(--pc); }
.pcard.is-turn { transform: translateX(-10px) scale(1.03); background: #fff8d6; }
.pcard.is-turn::after { content: '▶'; position: absolute; left: -26px; top: 50%; translate: 0 -50%; font-size: 22px; color: var(--ink); animation: nudge .8s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-5px); } }
.pcard.is-off { opacity: .6; }
.pcard-rank { font-family: var(--display); font-size: 22px; text-align: center; width: 30px; height: 30px; line-height: 28px; border-radius: 50%; background: #ece6ff; border: 3px solid var(--ink); margin-left: 6px; }
.pcard-rank[data-rank="1"] { background: var(--gold); }
.pcard-avatar svg { display: block; }
.pcard-main { min-width: 0; }
.pcard-name { font-family: var(--display); font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard-money { display: flex; gap: 10px; flex-wrap: wrap; }
.pcard .money { font-size: 20px; }
.tag-item { display: inline-flex; vertical-align: -4px; margin-left: 2px; }
.ph-me .inv { width: 100%; justify-content: flex-start; }
.money { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.money.bump { animation: bump .5s; }
@keyframes bump { 30% { transform: scale(1.35); } }
.pcard-pop { position: absolute; right: 8px; top: -6px; pointer-events: none; }
.pop { display: flex; align-items: center; gap: 2px; font-family: var(--display); font-size: 20px; padding: 2px 8px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; animation: popUp 1.8s ease-out forwards; }
.pop.up { background: #d9ffe9; }
.pop.down { background: #ffd6da; }
@keyframes popUp { 0% { transform: translateY(10px); opacity: 0; } 15% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-26px); opacity: 0; } }

.ticker { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; z-index: 4; display: flex; flex-direction: column; gap: 4px; max-width: min(520px, 50vw); pointer-events: none; }
.ticker div { background: rgba(255,255,255,.88); border: 3px solid var(--ink); border-radius: 12px; padding: 3px 10px; font-weight: 700; font-size: 15px; }
.ticker div:last-child { background: #fff; }

/* capas superpuestas */
.overlay { position: absolute; left: 0; top: 0; bottom: 0; right: 330px; z-index: 8; pointer-events: none; }
.overlay .btn, .overlay [data-ov], .overlay .card-preview { pointer-events: auto; }
.ov-center { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; }
.banner { text-align: center; padding: 26px 46px; background: var(--paper); border: 5px solid var(--ink); border-radius: 32px; box-shadow: 0 9px 0 var(--ink); animation: popIn .5s cubic-bezier(.3,1.6,.5,1); max-width: 760px; }
.banner h1 { font-size: clamp(44px, 7vw, 92px); line-height: 1; color: var(--berry); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.banner h2 { font-size: 54px; }
.banner small { font-family: var(--display); font-size: 26px; color: var(--muted); }
.banner p { font-size: 22px; font-weight: 700; margin: 10px 0 0; }
.banner.end h1 { color: var(--gold); }
.intro-money { display: flex; gap: 26px; justify-content: center; margin-top: 16px; font-family: var(--display); font-size: 26px; }
.intro-money span { display: inline-flex; align-items: center; gap: 8px; }
@keyframes popIn { from { transform: scale(.6) rotate(-3deg); opacity: 0; } }

.ov-turn { position: absolute; left: 0; right: 0; top: 16%; display: flex; justify-content: center; }
.turn-ribbon { display: flex; align-items: center; gap: 14px; padding: 10px 36px 10px 18px; background: var(--pc); border: 5px solid var(--ink); border-radius: 999px; box-shadow: 0 8px 0 var(--ink); animation: slideIn .55s cubic-bezier(.3,1.5,.5,1); }
.turn-ribbon small { display: block; font-family: var(--display); font-size: 20px; color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.turn-ribbon b { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 5vw, 60px); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; line-height: 1; }
@keyframes slideIn { from { transform: translateX(-120%) rotate(-4deg); } }

.ov-dice { position: absolute; left: 0; right: 0; top: 13%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.die-wrap { width: 132px; height: 132px; perspective: 600px; animation: hover 1.6s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-10px); } }
.die { position: relative; width: 132px; height: 132px; transform-style: preserve-3d; }
.die.idle { animation: idleSpin 3s linear infinite; }
.die.roll { animation: roll 1.3s cubic-bezier(.2,.8,.3,1) both; }
@keyframes idleSpin { from { transform: rotateX(-20deg) rotateY(0); } to { transform: rotateX(-20deg) rotateY(360deg); } }
@keyframes roll { 0% { transform: rotateX(900deg) rotateY(1260deg) rotateZ(180deg) scale(.5); } 100% { transform: rotateX(-12deg) rotateY(12deg) scale(1); } }
.die-face {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-size: 74px; color: var(--ink);
  background: linear-gradient(145deg, #fff 30%, #e9e1ff); border: 6px solid var(--ink); border-radius: 26px;
  backface-visibility: hidden;
}
.die-face.f1 { transform: translateZ(66px); background: linear-gradient(145deg, #fff3b0 30%, var(--gold)); }
.die-face.f2 { transform: rotateY(90deg) translateZ(66px); }
.die-face.f3 { transform: rotateY(180deg) translateZ(66px); }
.die-face.f4 { transform: rotateY(-90deg) translateZ(66px); }
.die-face.f5 { transform: rotateX(90deg) translateZ(66px); }
.die-face.f6 { transform: rotateX(-90deg) translateZ(66px); }
.dice-hint { background: var(--paper); border: var(--line) solid var(--ink); border-radius: 18px; padding: 8px 18px; box-shadow: var(--drop); text-align: center; font-weight: 700; font-size: 20px; }
.dice-hint b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.dice-hint small { display: block; color: var(--muted); font-size: 16px; }
.dice-result { font-family: var(--display); font-size: 64px; color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; opacity: 0; animation: popIn .4s cubic-bezier(.3,1.6,.5,1) forwards; }

.countdown { height: 12px; margin: 12px auto 0; width: min(360px, 80%); border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; background: #ece6ff; }
.countdown i { display: block; height: 100%; background: var(--berry); transform-origin: left; animation: drain linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }

.ov-low { position: absolute; left: 0; right: 0; bottom: 140px; display: flex; justify-content: center; padding: 0 20px; }
.card { padding: 18px 24px; text-align: center; animation: popIn .45s cubic-bezier(.3,1.6,.5,1); max-width: 620px; }
.card h3 { font-size: 34px; }
.tile-card { border-width: 5px; min-width: 320px; }
.tile-card .tile-kind { display: inline-block; font: 700 14px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--tc); color: #fff; border: 3px solid var(--ink); -webkit-text-stroke: 0; }
.tile-card p { margin: 6px 0 0; font-weight: 700; font-size: 20px; }
.tile-card.tone-good h3 { color: var(--blue); }
.tile-card.tone-bad h3 { color: var(--red); }
.tile-card.tone-great h3 { color: #d99400; }

.route-card .routes { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
.route { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border: var(--line) solid var(--ink); border-radius: 18px; text-align: left; background: #fff0f8; }
.route.b { background: #eaf2ff; }
.route > b { font-family: var(--display); font-size: 30px; width: 46px; height: 46px; line-height: 42px; text-align: center; border-radius: 50%; color: #fff; background: var(--berry); border: 3px solid var(--ink); flex: none; }
.route.b > b { background: var(--blue); }
.route strong { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; }
.route small { color: var(--muted); font-weight: 700; }

.shop-card { position: relative; overflow: hidden; padding-top: 34px; min-width: 360px; }
.shop-awning { position: absolute; left: 0; right: 0; top: 0; height: 22px; background: repeating-linear-gradient(90deg, var(--berry) 0 28px, #fff 28px 56px); border-bottom: 3px solid var(--ink); }
.shop-row { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; margin-top: 8px; }
.shop-price { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 40px; }
.shop-bal { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.shop-bal b { font-family: var(--display); font-weight: 400; font-size: 26px; }
.shop-done { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--display); font-size: 28px; }
.shop-done b { font-weight: 400; }

/* minijuegos y final */
.ov-full { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 70px 20px 20px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.35), rgba(27,36,64,.55)); pointer-events: auto; overflow-y: auto; }
.ov-full > * { margin: auto; }
.mg-panel { width: min(820px, 100%); background: var(--paper); border: 5px solid var(--ink); border-radius: 34px; box-shadow: 0 10px 0 var(--ink); padding: 26px 30px; text-align: center; animation: popIn .5s cubic-bezier(.3,1.6,.5,1); }
.mg-panel.wide { width: min(980px, 100%); }
.mg-src { font-family: var(--display); font-size: 20px; color: #fff; background: var(--ink); padding: 4px 14px; border-radius: 999px; }
.mg-title { font-family: var(--display); font-size: clamp(48px, 8vw, 96px); line-height: 1; margin: 12px 0 4px; color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.mg-title.small { font-size: 34px; margin: 0 0 12px; -webkit-text-stroke: 2px var(--ink); color: var(--berry); }
.mg-tag { font-family: var(--display); font-size: 26px; margin: 0; color: var(--muted); }
.mg-howto { margin: 16px auto; max-width: 560px; font-size: 20px; font-weight: 700; background: var(--cream); border: 3px dashed var(--ink); border-radius: 18px; padding: 12px 16px; }
.mg-rewards { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; margin-top: 12px; }
.mg-who { font-family: var(--display); font-size: 24px; margin: 6px 0 0; }
.vs { display: flex; align-items: center; justify-content: center; gap: 24px; }
.vs b { font-family: var(--display); font-weight: 400; font-size: 56px; color: var(--red); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.mg-head { font-family: var(--display); font-size: 22px; color: var(--muted); }
.mg-sub { font-weight: 700; }
.mg-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 16px; }
.mg-chip { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 84px; padding: 6px 8px; border: 3px solid var(--ink); border-radius: 16px; background: #f4f0ff; font-weight: 800; font-size: 15px; }
.mg-chip.wait { opacity: .7; }
.mg-chip.done, .mg-chip.ok { background: #d9ffe9; opacity: 1; }
.mg-chip.bad, .mg-chip.miss { background: #ffd6da; }
.mg-chip em { position: absolute; top: -12px; right: -10px; font-style: normal; font-family: var(--display); font-size: 17px; background: var(--gold); border: 3px solid var(--ink); border-radius: 999px; padding: 0 8px; }
.cof-card { position: relative; margin: 12px auto; max-width: 760px; padding: 26px 30px; border: 5px solid var(--ink); border-radius: 26px; background: var(--cream); }
.cof-card p { margin: 0; font-family: var(--display); font-size: clamp(28px, 3.8vw, 44px); line-height: 1.15; text-wrap: balance; }
.cof-legend { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-weight: 800; }
.cof-legend span { padding: 2px 12px; border: 3px solid var(--ink); border-radius: 999px; }
.cof-legend .cap, .btn.cap { background: var(--red); color: #fff; }
.cof-legend .fact, .btn.fact { background: var(--mint); color: var(--ink); }
.stamp { position: absolute; right: -14px; top: -26px; font-family: var(--display); font-size: 54px; padding: 0 22px; border: 5px solid var(--ink); border-radius: 18px; transform: rotate(8deg); animation: stamp .45s cubic-bezier(.3,1.8,.5,1); }
.stamp.fact { background: var(--mint); }
.stamp.cap { background: var(--red); color: #fff; }
@keyframes stamp { from { transform: rotate(8deg) scale(2.4); opacity: 0; } }
.si-target { display: inline-flex; flex-direction: column; align-items: center; padding: 8px 30px; border: 5px solid var(--ink); border-radius: 26px; background: var(--cream); }
.si-target small { font-family: var(--display); font-size: 22px; color: var(--muted); }
.si-target b { font-family: var(--display); font-weight: 400; font-size: 100px; line-height: 1; }
.si-target b i { font-style: normal; font-size: 44px; }
.si-target.small b { font-size: 46px; }
.si-target.small b i { font-size: 24px; }
.live-clock { font-family: var(--display); font-size: clamp(90px, 15vw, 170px); line-height: 1.1; color: var(--blue); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; }
.live-clock.hidden-time { color: var(--berry); animation: wobble .6s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(-3deg) scale(1.03); } }
.si-results { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; text-align: left; }
.si-row { display: grid; grid-template-columns: 170px 1fr 120px; gap: 12px; align-items: center; padding: 6px 10px; border: 3px solid var(--ink); border-radius: 16px; background: #f4f0ff; animation: popIn .4s both; }
.si-row:nth-child(2) { animation-delay: .25s; } .si-row:nth-child(3) { animation-delay: .5s; } .si-row:nth-child(4) { animation-delay: .75s; }
.si-row.win { background: #fff4c4; }
.si-who { display: flex; align-items: center; gap: 8px; font-weight: 800; min-width: 0; }
.si-who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.si-bar { position: relative; height: 22px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
.si-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-right: 3px solid var(--ink); }
.si-bar u { position: absolute; top: -2px; bottom: -2px; width: 4px; background: var(--ink); }
.si-val { font-family: var(--display); font-size: 24px; text-align: right; font-variant-numeric: tabular-nums; }
.si-val small { display: block; font-family: var(--body); font-weight: 800; font-size: 14px; color: var(--muted); }

.podium { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.podium li { display: grid; grid-template-columns: 54px 52px 1fr auto auto; align-items: center; gap: 12px; padding: 6px 14px; border: 4px solid var(--ink); border-radius: 18px; background: #f4f0ff; text-align: left; animation: popIn .4s both; }
.podium li:nth-child(2) { animation-delay: .2s; } .podium li:nth-child(3) { animation-delay: .4s; } .podium li:nth-child(n+4) { animation-delay: .6s; }
.podium .place-1 { background: #fff4c4; transform: scale(1.03); }
.podium .pl { font-family: var(--display); font-size: 30px; }
.podium .pn { font-family: var(--display); font-size: 26px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .ps { font-weight: 800; color: var(--muted); }
.podium .pr { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 24px; }

.bonuses { display: grid; gap: 14px; }
.bonus { padding: 14px; border: 4px solid var(--ink); border-radius: 22px; background: var(--cream); opacity: 0; animation: popIn .5s cubic-bezier(.3,1.6,.5,1) forwards; }
.bonus h3 { font-size: 34px; color: var(--berry); }
.bonus p { margin: 2px 0 8px; font-weight: 700; }
.bonus-win { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: var(--display); font-size: 26px; }
.bonus-win b { font-weight: 400; }
.bonus-win span { display: inline-flex; align-items: center; gap: 4px; }

.rank-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-variant-numeric: tabular-nums; }
.rank-table th { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--muted); }
.rank-table td { background: #f4f0ff; border-block: 3px solid var(--ink); padding: 6px 10px; font-family: var(--display); font-size: 26px; }
.rank-table tr { animation: popIn .4s both; }
.rank-table td:first-child { border-left: 3px solid var(--ink); border-radius: 14px 0 0 14px; }
.rank-table td:last-child { border-right: 3px solid var(--ink); border-radius: 0 14px 14px 0; }
.rank-table tr.first td { background: #fff4c4; }
.rank-table .who { display: flex; align-items: center; gap: 10px; text-align: left; }
.rank-table .num { text-align: center; }

.winner { padding-top: 30px; background: radial-gradient(circle at 30% 45%, rgba(255,255,255,.25), rgba(27,36,64,.78)); }
.ov-full > .confetti { margin: 0; }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.winner-wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; width: min(1180px, 100%); align-items: center; }
.winner-hero { text-align: center; }
.winner-avatars { display: flex; justify-content: center; gap: 10px; }
.w-av { animation: winJump 1.1s ease-in-out infinite; }
.w-av::before { content: ''; display: block; width: 90px; height: 50px; margin: 0 auto -18px; background: var(--gold); border: 4px solid var(--ink); clip-path: polygon(0 100%, 0 20%, 25% 60%, 50% 0, 75% 60%, 100% 20%, 100% 100%); }
@keyframes winJump { 50% { transform: translateY(-16px); } }
.winner-hero small { font-family: var(--display); font-size: 26px; color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.winner-hero h1 { font-size: clamp(50px, 7vw, 100px); color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; line-height: 1; }
.winner-hero p { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 26px; background: #fff; border: 4px solid var(--ink); border-radius: 999px; padding: 4px 18px; }
.winner-side { min-width: 0; overflow-x: auto; background: var(--paper); border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 10px 0 var(--ink); padding: 16px 20px; }
.awards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.award { padding: 8px 10px; border: 3px solid var(--ink); border-radius: 14px; background: var(--cream); text-align: left; }
.award b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--berry); }
.award span { font-weight: 800; }
.award small { display: block; color: var(--muted); font-weight: 700; }
.winner-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.card-preview { margin-top: 12px; text-align: center; }
.card-preview img { max-width: 260px; border: 4px solid var(--ink); border-radius: 16px; }
.card-actions { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 6px; flex-wrap: wrap; }

/* lobby (TV) */
.lobby { position: absolute; inset: 0; z-index: 10; overflow-y: auto; background: radial-gradient(circle at 50% 35%, #2c55e0, var(--royal) 40%, var(--royal-deep)); } }
.lobby-inner { width: min(1180px, 100%); margin: 0 auto; padding-block: 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.title-big { font-family: var(--display); font-size: clamp(46px, 8vw, 110px); line-height: .95; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); text-align: center; margin: 0; }
.title-big span { color: var(--gold); }
.subtitle { text-align: center; font-family: var(--display); font-size: 24px; margin: 4px 0 0; color: #fff; }
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 22px; align-items: start; }
.join-panel, .players-panel, .settings-panel { padding: 20px; }
.join-panel { text-align: center; }
.join-panel .code { font-family: var(--display); font-size: clamp(70px, 10vw, 128px); letter-spacing: .12em; line-height: 1; color: var(--berry); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.join-url { font-weight: 800; font-size: 20px; word-break: break-all; background: var(--cream); border: 3px dashed var(--ink); border-radius: 14px; padding: 8px 12px; margin: 10px 0; }
.join-panel p { margin: 6px 0; font-weight: 700; }
.players-panel h2, .settings-panel h2 { font-size: 32px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lobby-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.lp { position: relative; display: flex; flex-direction: column; align-items: center; padding: 10px; border: 3px solid var(--ink); border-radius: 18px; background: #f4f0ff; font-family: var(--display); font-size: 20px; animation: popIn .4s cubic-bezier(.3,1.6,.5,1); }
.lp .x { position: absolute; top: 4px; right: 6px; border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
.lp .x:focus-visible { outline: 3px solid var(--blue); border-radius: 6px; }
.lp.empty { opacity: .45; border-style: dashed; font-family: var(--body); font-weight: 700; font-size: 16px; justify-content: center; min-height: 120px; animation: none; }
.lobby-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.lobby-actions .btn.start { font-size: 30px; padding: 14px 40px; }
.how { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.how div { padding: 12px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; font-weight: 700; font-size: 16px; }
.how b { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 400; font-size: 21px; }

/* configuración */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.settings fieldset { margin: 0; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 12px 12px; display: grid; gap: 8px; min-width: 0; }
.settings legend { font-family: var(--display); font-size: 20px; padding: 0 6px; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.field small { display: block; font-size: 12px; color: var(--muted); }
.field input, .field select { width: 110px; padding: 6px 8px; border: 3px solid var(--ink); border-radius: 10px; background: #fff; font-weight: 800; }
.field input:focus-visible, .field select:focus-visible, .check input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 16px; }
.check input { width: 20px; height: 20px; accent-color: var(--berry); }
.check.soon { opacity: .55; }
.check small { color: var(--muted); }
.games { display: grid; gap: 4px; }
.modal { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(27,36,64,.5); padding: 20px; overflow-y: auto; }
.modal .panel { width: min(1100px, 100%); padding: 20px; max-height: 100%; overflow-y: auto; }

/* responsive TV */
@media (max-width: 900px) {
  .hud { top: auto; bottom: 0; left: 0; right: 0; width: auto; height: 96px; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); }
  .pcard { flex: none; width: 230px; }
  .pcard.is-turn { transform: translateY(-4px); }
  .pcard.is-turn::after { display: none; }
  .overlay { right: 0; bottom: 100px; }
  .ov-low { bottom: 16px; }
  .topbar { max-width: calc(100% - 24px); }
  .ticker { display: none; }
  .lobby-grid, .winner-wrap { grid-template-columns: 1fr; }
  .w-av svg { width: 110px; height: auto; }
  .winner-hero h1 { -webkit-text-stroke: 3px var(--ink); }
  .how { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .si-row { grid-template-columns: 110px 1fr 90px; }
}
@media (max-width: 520px) {
  .chip { font-size: 16px; padding: 5px 10px; }
  .rank-table td { font-size: 19px; padding: 4px 6px; }
  .rank-table .who svg { width: 26px; height: auto; }
  .winner-hero p { font-size: 19px; flex-wrap: wrap; justify-content: center; }
  .winner-side { padding: 12px; }
  .banner { padding: 18px 20px; }
  .mg-panel { padding: 18px 14px; }
  .podium li { grid-template-columns: 40px 44px 1fr auto; }
  .podium .ps { display: none; }
  .how { grid-template-columns: 1fr; }
  .awards { grid-template-columns: 1fr; }
}

/* ================= CELULAR ================= */
body.phone { background: radial-gradient(circle at 50% 30%, var(--royal), var(--royal-deep)) fixed; min-height: 100%; }
.phone-wrap { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 14px; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ph-me { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--paper); border: var(--line) solid var(--ink); border-left: 14px solid var(--pc); border-radius: 22px; box-shadow: var(--drop); flex-wrap: wrap; }
.ph-me b { font-family: var(--display); font-weight: 400; font-size: 24px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-me em { font-style: normal; }
.ph-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 26px; box-shadow: var(--drop); padding: 20px; min-height: 340px; text-align: center; }
.ph-wait { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ph-wait b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; text-wrap: balance; }
.ph-wait small { font-family: var(--display); font-size: 18px; color: var(--muted); }
.ph-wait p { margin: 0; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.ph-wait.mine b { color: var(--berry); }
.ph-wait.tone-good b { color: var(--blue); }
.ph-wait.tone-bad b { color: var(--red); }
.ph-title { font-family: var(--display); font-size: 30px; margin: 0; }
.ph-note { margin: 0; font-weight: 700; color: var(--muted); }
.ph-note.warn { color: var(--red); }
.btn.huge { width: 100%; min-height: 150px; font-size: 40px; border-radius: 28px; flex-direction: column; }
.btn.roll { background: var(--gold); }
.mini-die { display: grid; place-items: center; width: 64px; height: 64px; border: 4px solid var(--ink); border-radius: 16px; background: #fff; font-size: 40px; animation: idleWobble 1.4s ease-in-out infinite; }
@keyframes idleWobble { 50% { transform: rotate(10deg) scale(1.06); } }
.btn.stop { background: var(--red); color: #fff; min-height: 220px; font-size: 56px; }
.btn.big { min-height: 120px; font-size: 38px; flex-direction: column; width: 100%; }
.ph-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ph-q { font-family: var(--display); font-size: 26px; line-height: 1.15; background: var(--cream); border: 3px solid var(--ink); border-radius: 18px; padding: 14px; text-wrap: balance; }
.ph-mg { display: flex; flex-direction: column; gap: 14px; }
.ph-big { font-family: var(--display); font-size: 46px; }
.ph-big.good { color: var(--mint); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.ph-big.bad { color: var(--red); }
.ph-routes { display: grid; gap: 12px; }
.route-btn { justify-content: flex-start; text-align: left; background: #fff0f8; padding: 14px; }
.route-btn.b { background: #eaf2ff; }
.route-btn b { width: 48px; height: 48px; line-height: 44px; border-radius: 50%; text-align: center; color: #fff; background: var(--berry); border: 3px solid var(--ink); font-size: 28px; flex: none; }
.route-btn.b b { background: var(--blue); }
.route-btn span { display: flex; flex-direction: column; font-size: 24px; }
.route-btn small { font-size: 15px; }
.ph-buy { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.btn.buy { flex-direction: column; font-size: 28px; background: var(--gold); padding: 12px 8px; }
.btn.buy small { display: inline-flex; align-items: center; gap: 4px; }
.join-form { display: grid; gap: 12px; }
.join-form label { display: grid; gap: 4px; font-family: var(--display); font-size: 20px; text-align: left; }
.join-form input { width: 100%; min-width: 0; padding: 12px 14px; border: var(--line) solid var(--ink); border-radius: 16px; font-size: 22px; font-weight: 800; background: #fff; }
.join-form input:focus-visible { outline: 4px solid var(--blue); }
#code-input { text-transform: uppercase; letter-spacing: .2em; font-family: var(--display); font-size: 30px; text-align: center; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--ink); cursor: pointer; }
.swatch[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
.hats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.hat { padding: 4px 10px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; font-weight: 800; cursor: pointer; }
.hat[aria-pressed="true"] { background: var(--gold); }
.preview-bean { display: flex; justify-content: center; }
.err { color: var(--red); font-weight: 800; min-height: 1.4em; margin: 0; }
.ph-foot { text-align: center; font-weight: 700; font-size: 14px; color: var(--ink); opacity: .7; }

/* portada */
.home { position: relative; overflow: hidden; min-height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2c55e0, var(--royal) 40%, var(--royal-deep)); padding-block: 30px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home-inner { display: grid; gap: 20px; justify-items: center; text-align: center; max-width: 760px; }
.home-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 100%; }
.home-cards a { display: grid; gap: 6px; padding: 22px; text-decoration: none; color: var(--ink); }
.home-cards a b { font-family: var(--display); font-weight: 400; font-size: 32px; }
.home-cards a:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
@media (max-width: 560px) { .home-cards { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  .countdown i { animation-duration: inherit !important; }
}

/* ---------- fondo animado azul rey (portada y lobby) ---------- */
.rays { position: fixed; inset: -50%; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.07) 0deg 10deg, transparent 10deg 24deg);
  animation: rays 60s linear infinite; }
@keyframes rays { to { transform: rotate(360deg); } }
.floaters { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.floaters i { position: absolute; bottom: -80px; width: 46px; height: 46px; opacity: .16; animation: rise linear infinite; }
.floaters i.d { background: #0d0f17; border: 3px solid #fff; border-radius: 12px; }
.floaters i.d::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, #fff 4px, transparent 5px), radial-gradient(circle at 70% 70%, #fff 4px, transparent 5px), radial-gradient(circle at 50% 50%, #fff 4px, transparent 5px); }
.floaters i.c { border-radius: 50%; background: #ffb400; border: 3px solid #fff; }
.floaters i.b { width: 64px; height: 36px; border-radius: 4px; background: #7fc98f; border: 3px solid #fff; }
@keyframes rise { to { transform: translateY(-120vh) rotate(260deg); } }
.lobby-inner, .home-inner { position: relative; z-index: 1; }
.title-big span { color: #ffb400; }
.adult { display: inline-block; font-size: 16px !important; background: #111827; color: #fff; border-radius: 999px; padding: 4px 14px; }

/* ---------- personajes ---------- */
.av { position: relative; display: inline-flex; align-items: flex-end; justify-content: center; height: var(--h); flex: none; }
.av img { height: 100%; width: auto; display: block; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.av::after { content: ''; position: absolute; left: 15%; right: 15%; bottom: -3px; height: 8px; border-radius: 50%; background: var(--pc); opacity: .85; z-index: -1; }
.av-comp { position: absolute; right: -28%; bottom: 0; height: 80%; display: flex; align-items: flex-end; }
.av-comp svg { height: 100%; width: auto; }
.av.crowned::before { content: ''; position: absolute; top: -18%; left: 50%; translate: -50% 0; width: 46%; aspect-ratio: 2 / 1; background: #ffb400; border: 4px solid var(--ink); clip-path: polygon(0 100%, 0 20%, 25% 60%, 50% 0, 75% 60%, 100% 20%, 100% 100%); z-index: 2; }
.w-av::before { display: none; }
.pcard-avatar { display: flex; justify-content: center; }
.money .ico-pemolar { margin-right: 2px; }

/* ---------- dado negro ---------- */
.dice-row { display: flex; gap: 26px; justify-content: center; }
.die-wrap { position: relative; }
.die-face { background: radial-gradient(circle at 30% 25%, #2b3142, #07080d 70%); border: 5px solid #000; box-shadow: inset 0 0 0 2px rgba(127,178,255,.35), inset 0 10px 18px rgba(255,255,255,.08); color: #fff; }
.die-face.f1 { background: radial-gradient(circle at 30% 25%, #343b50, #07080d 70%); }
.die-face svg { width: 84%; height: 84%; }
.die-face .pip { fill: #fff; filter: drop-shadow(0 0 5px rgba(170,210,255,.95)); }
.die-face .spark { fill: #dfe8ff; opacity: .85; }
.die-num { font-family: var(--display); font-size: 70px; color: #fff; text-shadow: 0 0 12px rgba(170,210,255,.9); }
.orbit { position: absolute; left: 50%; top: 50%; width: 210px; height: 70px; margin: -35px 0 0 -105px; border-radius: 50%; border: 3px solid rgba(160,200,255,.75); border-left-color: transparent; border-bottom-color: rgba(255,255,255,.2); box-shadow: 0 0 14px rgba(120,170,255,.6); animation: orbit 1.2s linear infinite; pointer-events: none; }
.orbit.o2 { width: 180px; height: 60px; margin: -30px 0 0 -90px; animation-duration: 1.8s; animation-direction: reverse; transform: rotate(24deg); }
@keyframes orbit { from { transform: rotate(-18deg) rotateZ(0); } to { transform: rotate(-18deg) rotateZ(360deg); } }
.die-wrap:has(.roll) .orbit { animation-iteration-count: 2; opacity: 0; animation-name: orbitOut; }
@keyframes orbitOut { 0% { opacity: 1; transform: rotate(0); } 100% { opacity: 0; transform: rotate(540deg); } }
.die-wrap { animation-delay: calc(var(--i, 0) * 120ms); }
.dice-result { color: #fff; }

/* ---------- avisos de shot ---------- */
